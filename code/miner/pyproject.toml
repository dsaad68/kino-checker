[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miner"
version = "0.2.0"
description = "Web scraper service for discovering new cinema releases"
authors = [{name = "Daniel Saad", email = "me@dsaad.com"}]
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "common",
    "aiohttp>=3.11.0,<4.0",
    "beautifulsoup4>=4.12.2",
    "pyTelegramBotAPI>=4.24.0,<5.0",
    "requests>=2.32.0,<3.0",
    "SQLAlchemy>=2.0.40,<3.0",
    "psycopg2-binary>=2.9.6",
    "alive_progress>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "debugpy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/miner"]

[tool.uv.sources]
common = { workspace = true }
