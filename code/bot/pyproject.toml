[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot"
version = "0.2.1"
description = "Telegram bot for cinema release notifications and AI-powered film queries"
authors = [{name = "Daniel Saad", email = "me@dsaad.com"}]
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "common",
    "aiohttp>=3.11.0,<4.0",
    "pyTelegramBotAPI>=4.24.0,<5.0",
    "SQLAlchemy>=2.0.40,<3.0",
    "psycopg2-binary>=2.9.6",
    "openai>=1.60.0,<2.0",
    "langchain>=0.3.0,<0.4",
    "elevenlabs>=1.0.0,<2.0",
    "langchain_openai>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "debugpy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.uv.sources]
common = { workspace = true }
