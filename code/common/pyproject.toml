[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common"
version = "0.1.0"
description = "Shared database models, utilities, and common code"
authors = [{name = "Daniel Saad", email = "me@dsaad.com"}]
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "SQLAlchemy>=2.0.40,<3.0",
    "psycopg2-binary>=2.9.6",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "debugpy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
