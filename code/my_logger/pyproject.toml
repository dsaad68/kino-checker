[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my_logger"
version = "0.0.1"
description = "Custom logger with Azure Application Insights integration"
authors = [{name = "Daniel Saad", email = "me@dsaad.com"}]
requires-python = ">=3.11"
readme = "README.MD"
license = {text = "MIT"}

dependencies = [
    "opencensus>=0.11.2",
    "opencensus-context>=0.1.3",
    "opencensus-ext-azure>=1.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/my_logger"]
