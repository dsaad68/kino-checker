[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleaner"
version = "0.1.0"
description = "Database cleanup service for removing old cinema releases"
authors = [{name = "Daniel Saad", email = "me@dsaad.com"}]
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "common",
    "SQLAlchemy>=2.0.40,<3.0",
    "psycopg2-binary>=2.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "debugpy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cleaner"]

[tool.uv.sources]
common = { workspace = true }
